name: Catalog validation and upstream sync

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned validation dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --ignore-scripts
      - name: Resolve recorded upstream revision
        id: upstream
        run: |
          python - <<'PY'
          import json, os, re
          commit = json.load(open('sync-state.json'))['commit']
          assert re.fullmatch('[0-9a-f]{40}', commit)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('commit=' + commit + '\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cursor/plugins
          ref: ${{ steps.upstream.outputs.commit }}
          path: .cache/upstream
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: makecindy/cindy
          ref: 5ab30ec856e57e2ae8944657e9e2d69264c672f5 # v0.1.126
          path: .cache/cindy
          persist-credentials: false
      - name: Test converter, reproducibility and official Cindy manifests
        run: |
          python -m unittest discover -s tests -v
          python scripts/sync.py --upstream .cache/upstream --check
          npm run validate:host -- .cache/cindy

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned validation dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --ignore-scripts
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cursor/plugins
          ref: main
          path: .cache/upstream
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: makecindy/cindy
          ref: 5ab30ec856e57e2ae8944657e9e2d69264c672f5 # v0.1.126
          path: .cache/cindy
          persist-credentials: false
      - name: Generate and validate a complete catalog before publishing
        run: |
          python -m unittest discover -s tests -v
          python scripts/sync.py --upstream .cache/upstream
          python scripts/sync.py --upstream .cache/upstream --check
          npm run validate:host -- .cache/cindy
      - name: Commit successful changes
        run: |
          git add -- catalog .agents/plugins/marketplace.json .cursor-plugin/marketplace.json sync-state.json
          if git diff --cached --quiet; then
            echo 'Upstream is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync cursor/plugins' -m 'Assisted-by: Cindy (https://cindy.app)'
          git push origin HEAD:main
